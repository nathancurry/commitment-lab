[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-cull"
version = "0.1.0"
description = "Read-only photo culling assistant: technical checks and previews, never deletes anything."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "rawpy>=0.24",
    "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
photo-cull = "photo_cull.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
